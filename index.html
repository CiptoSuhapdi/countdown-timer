<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <title>Countdown Timer</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center;
      padding: 24px; color: #f8fafc;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: radial-gradient(circle at top, #243b61 0, #101827 48%, #080d16 100%);
    }
    .wrap { width: min(760px, 100%); text-align: center; }
    .eyebrow { color: #93c5fd; letter-spacing: .22em; text-transform: uppercase; font-size: .75rem; font-weight: 700; }
    h1 { margin: 12px 0 8px; font-size: clamp(2rem, 7vw, 3.5rem); }
    .sub { color: #aab7ca; margin: 0 0 34px; }
    .timer { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .unit {
      padding: 24px 10px; border: 1px solid #334765; border-radius: 18px;
      background: rgba(22, 35, 56, .82); box-shadow: 0 18px 50px #0004;
    }
    .number { display: block; font-size: clamp(2rem, 8vw, 4rem); font-weight: 800; font-variant-numeric: tabular-nums; line-height: 1.1; }
    .label { display: block; margin-top: 9px; color: #9fb0c8; font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; }
    .panel { margin: 28px auto 0; padding: 20px; max-width: 560px; border: 1px solid #334765; border-radius: 16px; background: #111e30cc; text-align: left; }
    label { display: block; margin-bottom: 8px; color: #cbd5e1; font-size: .9rem; }
    .controls { display: flex; gap: 10px; }
    input, button { min-height: 46px; border-radius: 10px; font: inherit; }
    input { flex: 1; min-width: 0; padding: 0 12px; color: #f8fafc; background: #0b1422; border: 1px solid #425675; }
    button { padding: 0 18px; border: 0; color: #07111f; background: #60a5fa; font-weight: 750; cursor: pointer; }
    button:hover { background: #93c5fd; }
    #status { min-height: 22px; margin: 12px 0 0; color: #aab7ca; font-size: .88rem; }
    footer { margin-top: 24px; color: #70819a; font-size: .8rem; }
    @media (max-width: 520px) {
      .timer { grid-template-columns: repeat(2, 1fr); }
      .unit { padding: 20px 8px; }
      .controls { flex-direction: column; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="eyebrow">Live countdown</div>
    <h1 id="title">Hitung Mundur</h1>
    <p class="sub">Waktu tersisa menuju momen yang kamu tentukan</p>

    <section class="timer" aria-live="polite" aria-label="Waktu tersisa">
      <div class="unit"><span class="number" id="days">00</span><span class="label">Hari</span></div>
      <div class="unit"><span class="number" id="hours">00</span><span class="label">Jam</span></div>
      <div class="unit"><span class="number" id="minutes">00</span><span class="label">Menit</span></div>
      <div class="unit"><span class="number" id="seconds">00</span><span class="label">Detik</span></div>
    </section>

    <section class="panel">
      <label for="target">Pilih tanggal dan jam tujuan</label>
      <div class="controls">
        <input id="target" type="datetime-local">
        <button id="start" type="button">Mulai</button>
      </div>
      <p id="status">Pilih waktu tujuan, lalu tekan Mulai.</p>
    </section>
    <footer>Countdown berjalan otomatis • Zona waktu mengikuti perangkat</footer>
  </main>

  <script>
    const fields = {
      days: document.getElementById('days'),
      hours: document.getElementById('hours'),
      minutes: document.getElementById('minutes'),
      seconds: document.getElementById('seconds')
    };
    const input = document.getElementById('target');
    const status = document.getElementById('status');
    // Target: Sabtu, 21 November 2026 pukul 22.00 WIB.
    // Waktu lokal perangkat digunakan; untuk pengguna di WIB hasilnya tepat WIB.
    let targetTime = new Date(2026, 10, 21, 22, 0, 0).getTime();
    let ticker = null;

    function pad(value) { return String(value).padStart(2, '0'); }

    function render() {
      if (!targetTime) return;
      let remaining = Math.max(0, targetTime - Date.now());
      const totalSeconds = Math.floor(remaining / 1000);
      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      fields.days.textContent = pad(days);
      fields.hours.textContent = pad(hours);
      fields.minutes.textContent = pad(minutes);
      fields.seconds.textContent = pad(seconds);

      if (remaining <= 0) {
        status.textContent = 'Waktu tujuan telah tiba!';
        clearInterval(ticker);
        ticker = null;
      }
    }

    // Isi tanggal tujuan dan langsung mulai saat halaman dibuka.
    const initialTarget = new Date(2026, 10, 21, 22, 0, 0);
    const localValue = new Date(initialTarget.getTime() - initialTarget.getTimezoneOffset() * 60000)
      .toISOString().slice(0, 16);
    input.value = localValue;
    status.textContent = 'Countdown menuju Sabtu, 21 November 2026 pukul 22.00 WIB sedang berjalan.';
    render();
    ticker = setInterval(render, 250);

    document.getElementById('start').addEventListener('click', () => {
      const parsed = new Date(input.value).getTime();
      if (!input.value || !Number.isFinite(parsed)) {
        status.textContent = 'Silakan pilih tanggal dan jam yang valid.';
        return;
      }
      if (parsed <= Date.now()) {
        status.textContent = 'Pilih waktu yang masih akan datang.';
        return;
      }
      targetTime = parsed;
      document.getElementById('title').textContent = 'Menuju Waktu Tujuan';
      status.textContent = 'Countdown sedang berjalan.';
      if (ticker) clearInterval(ticker);
      render();
      ticker = setInterval(render, 250);
    });
  </script>
</body>
</html>
